[project]
name = "tvm802-pnp"
version = "0.1.0"
description = "Standalone pick-and-place control software for the TVM802"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pyyaml>=6", "ruamel.yaml>=0.18", "numpy>=1.26", "opencv-python-headless>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tvm-sim = "pnp.sim.__main__:main"
tvm-monitor = "pnp.tvm.monitor:main"
tvm-pnp = "pnp.api.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pnp*"]

[tool.setuptools.package-data]
# The sim's demo job reads examples/demo.pos from the source tree (not packaged).
"pnp.web" = ["*.html", "*.js", "*.css", "*.svg", "*.png", "fonts/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
